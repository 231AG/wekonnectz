<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D11; color: #F3F1EC; font-family: Manrope, sans-serif; display: flex; flex-direction: column; overflow: hidden"><div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 24px; overflow: hidden; min-height: 0"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px"><button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #202028; border: 1px solid #30303B; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F1EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m12 19-7-7 7-7M19 12H5"></path></svg></button><div style="flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: #F3F1EC"></div><div style="width: 44px"></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; justify-content: space-between; font-size: 12px; color: #A9A7B2; font-weight: 600"><span>Step 1 of 8</span><span>12%</span></div><div style="height: 4px; border-radius: 4px; background: #202028"><div style="width: 12%; height: 4px; border-radius: 4px; background: #E3C28E"></div></div></div><h1 style="margin: 0; font-family: Sora, Manrope, sans-serif; font-size: 28px; line-height: 33px; font-weight: 700; color: #F3F1EC">You must be 18 or older</h1><p style="margin: 0; font-size: 15px; line-height: 22px; color: #A9A7B2">Enter your date of birth. It is checked again during photo verification.</p><div style="display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px"><div style="display: flex; flex-direction: column; gap: 8px"><label for="dob-d" style="font-size: 13px; font-weight: 600; color: #A9A7B2">Day</label><input id="dob-d" type="text" value="14" placeholder="DD" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; border-radius: 14px; background: #17171D; border: 1.5px solid #30303B; color: #F3F1EC; font-family: Manrope, sans-serif; font-size: 16px"></div><div style="display: flex; flex-direction: column; gap: 8px"><label for="dob-m" style="font-size: 13px; font-weight: 600; color: #A9A7B2">Month</label><input id="dob-m" type="text" value="03" placeholder="MM" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; border-radius: 14px; background: #17171D; border: 1.5px solid #30303B; color: #F3F1EC; font-family: Manrope, sans-serif; font-size: 16px"></div><div style="display: flex; flex-direction: column; gap: 8px"><label for="dob-y" style="font-size: 13px; font-weight: 600; color: #A9A7B2">Year</label><input id="dob-y" type="text" value="1999" placeholder="YYYY" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; border-radius: 14px; background: #17171D; border: 1.5px solid #30303B; color: #F3F1EC; font-family: Manrope, sans-serif; font-size: 16px"></div></div><div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #17171D; border: 1px solid #30303B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3C28E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><p style="margin: 0; font-size: 13px; line-height: 19px; color: #A9A7B2">Your date of birth can’t be changed later. Only your age is shown on your profile.</p></div><div style="flex: 1"></div><button type="button" style="width: 100%; min-height: 52px; padding: 0 20px; border-radius: 14px; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #E3C28E; color: #17140E; border: none">Continue</button></div></div>
