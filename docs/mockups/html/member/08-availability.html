<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>WeKonnectz mock-up — Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D11; color: #F3F1EC; font-family: Manrope, sans-serif; display: flex; flex-direction: column; overflow: hidden"><div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 24px; overflow: hidden; min-height: 0"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px"><button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #202028; border: 1px solid #30303B; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F1EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m12 19-7-7 7-7M19 12H5"></path></svg></button><div style="flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: #F3F1EC">Availability</div><div style="width: 44px"></div></div><div style="display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: #17171D; border: 1px solid #30303B"><button type="button" aria-pressed="true" style="flex: 1; min-height: 44px; border-radius: 10px; background: #202028; color: #F3F1EC; border: none; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700">Available now</button><button type="button" style="flex: 1; min-height: 44px; border-radius: 10px; background: transparent; color: #A9A7B2; border: none; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700">Schedule</button></div><div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 18px; background: #17171D; border: 1px solid #30303B"><div style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E3C28E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span style="font-size: 15px; font-weight: 700">Today, Sun 4 Oct</span></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px"><div style="display: flex; flex-direction: column; gap: 8px"><label for="st" style="font-size: 13px; font-weight: 600; color: #A9A7B2">From</label><input id="st" type="text" value="Now" placeholder="" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; border-radius: 14px; background: #17171D; border: 1.5px solid #30303B; color: #F3F1EC; font-family: Manrope, sans-serif; font-size: 16px"></div><div style="display: flex; flex-direction: column; gap: 8px"><label for="en" style="font-size: 13px; font-weight: 600; color: #A9A7B2">Until</label><input id="en" type="text" value="11:00 PM" placeholder="" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; border-radius: 14px; background: #17171D; border: 1.5px solid #30303B; color: #F3F1EC; font-family: Manrope, sans-serif; font-size: 16px"></div></div><p style="margin: 0; font-size: 13px; line-height: 19px; color: #A9A7B2">Longest window: [WINDOW LIMIT]. You leave the pool automatically when it ends or your pass expires.</p></div><div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 18px; background: #17171D; border: 1px solid #30303B"><span style="font-size: 15px; font-weight: 700">Who can send you requests</span><div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 12px; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; background: #E3C28E; color: #17140E; border: none">Anyone in the pool</button><button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 12px; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; background: #17171D; color: #F3F1EC; border: 1.5px solid #30303B">Nobody</button></div></div><div style="flex: 1"></div><div style="display: flex; flex-direction: column; gap: 10px"><button type="button" style="width: 100%; min-height: 52px; padding: 0 20px; border-radius: 14px; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #F2945C; color: #2A1206; border: none">Go available</button><button type="button" style="width: 100%; min-height: 52px; padding: 0 20px; border-radius: 14px; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: transparent; color: #F3F1EC; border: 1.5px solid #30303B">Pause</button></div></div></div>
